name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check tag matches workspace version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          versions="$(printf '%s\n' "$metadata" \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')"
          echo "$versions"
          if [ -z "$versions" ]; then
            echo "::error::no publishable crates found in the workspace"
            exit 1
          fi
          mismatch="$(echo "$versions" | awk -v v="$tag_version" '$2 != v')"
          if [ -n "$mismatch" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version:"
            echo "$mismatch"
            exit 1
          fi

      - name: Dry-run publish (stale internal pins stop the release here)
        run: cargo publish --dry-run --workspace

      - name: Publish openkspace-io
        run: cargo publish -p openkspace-io --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish openkspace-recon
        run: cargo publish -p openkspace-recon --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish openkspace-cli
        run: cargo publish -p openkspace-cli --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

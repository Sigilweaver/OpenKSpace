name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install HDF5 (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Install HDF5 (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install hdf5
          echo "HDF5_DIR=$(brew --prefix hdf5)" >> "$GITHUB_ENV"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  docs-validation:
    name: Shared docs validation
    permissions:
      contents: read
    uses: Sigilweaver/ops/.github/workflows/docs.yml@757c6789b96e3ac05bbc7d1a092d01cbeb0cb9e2
    with:
      tooling-ref: 757c6789b96e3ac05bbc7d1a092d01cbeb0cb9e2
  docs:
    name: Docs (Docusaurus)
    needs: docs-validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      DOCS_RESULT: ${{ needs.docs-validation.result }}
    steps:
      - run: test "$DOCS_RESULT" = success
